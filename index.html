<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPO Boss Timers - Giờ Việt Nam</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #9ca3af;
      --light-pink: #d1d5db;
      --dark-pink: #4b5563;
      --bg: #1a0a1a;
      --card-bg: #0a0a0a;
      --border: #6b7280;
      --text: #e5e7eb;
      --green: #e2e8f0;
      --yellow: #fbbf24;
      --cyan: #94a3b8;
      --red: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #000;
      font-family: 'VT323', monospace;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 14px 16px;
    }

    .wrapper { position: relative; z-index: 1; width: 100%; max-width: 1150px; }
    #cardsContainer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: stretch; }
    @media (max-width: 860px) { #cardsContainer { grid-template-columns: 1fr; } }

    /* Maid character top */
    .maid-top {
      display: block;
      margin: 0 auto 10px;
      width: 120px;
      height: 120px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(14px, 3vw, 20px);
      color: var(--pink);
      text-shadow: 0 0 8px rgba(156,163,175,0.35);
      letter-spacing: 2px;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .subtitle {
      font-size: 18px;
      color: var(--light-pink);
      opacity: 0.85;
    }

    .sync-info {
      display: inline-block;
      background: rgba(156,163,175,0.15);
      border: 1px solid var(--pink);
      border-radius: 20px;
      padding: 4px 16px;
      font-size: 16px;
      color: var(--cyan);
      margin-top: 4px;
    }

    /* Clock */
    .live-clock {
      text-align: center;
      margin-bottom: 12px;
      font-size: 30px;
      color: #f3f4f6;
      text-shadow: 0 0 8px rgba(243,244,246,0.25);
      letter-spacing: 2px;
    }

    .live-clock span { font-size: 20px; color: var(--light-pink); display: block; margin-top: 2px; }

    /* Cards */
    .boss-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 0;
      box-shadow: none;
      position: relative;
      overflow: hidden;
    }

    .boss-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--pink), transparent);
    }

    .boss-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .boss-name {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(10px, 2.5vw, 14px);
      color: var(--pink);
      text-shadow: 0 0 6px var(--pink);
    }

    .boss-schedule {
      font-size: 18px;
      color: var(--light-pink);
      opacity: 0.75;
    }

    .timers-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .timer-block {
      background: #000;
      border: 1px solid rgba(156,163,175,0.3);
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
    }

    .timer-label {
      font-size: 16px;
      color: var(--light-pink);
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .timer-value {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(12px, 3vw, 18px);
      color: var(--green);
      text-shadow: 0 0 8px var(--green);
      letter-spacing: 1px;
    }

    .timer-value.warning { color: var(--yellow); text-shadow: 0 0 8px var(--yellow); }
    .timer-value.danger  { color: var(--red);    text-shadow: 0 0 8px var(--red);    animation: blink 0.6s infinite; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .next-spawn {
      font-size: 19px;
      color: var(--cyan);
      margin-bottom: 10px;
    }

    /* Alert button */
    .alert-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 7px 14px;
      border-radius: 6px;
      border: 2px solid;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
    }

    .alert-btn.off {
      border-color: rgba(156,163,175,0.4);
      color: rgba(156,163,175,0.5);
    }

    .alert-btn.on {
      border-color: var(--green);
      color: var(--green);
      text-shadow: 0 0 6px var(--green);
      box-shadow: 0 0 10px rgba(226,232,240,0.2);
    }

    .alert-btn:hover { transform: scale(1.05); }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .spawn-times {
      font-size: 17px;
      color: var(--light-pink);
      opacity: 0.6;
      flex: 1 1 100%;
      line-height: 1.3;
    }

    /* Maid bottom */
    .maid-bottom {
      display: block;
      margin: 10px auto 0;
      width: 100px;
      opacity: 0.8;
    }

    footer {
      text-align: center;
      margin-top: 12px;
      font-size: 16px;
      color: rgba(156,163,175,0.4);
    }

    /* SVG maid placeholder */
    .maid-svg {
      width: 72px;
      height: 72px;
      display: block;
      margin: 0 auto 4px;
    }

    /* Responsive */
    @media(max-width:420px){
      .timers-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- Đầu lâu + kiếm chéo -->
  <svg class="maid-svg" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg" aria-label="Đầu lâu và kiếm">
    <!-- kiếm chéo -->
    <g stroke-linecap="round">
      <line x1="16" y1="18" x2="94" y2="96" stroke="#6b7280" stroke-width="6"/>
      <line x1="94" y1="18" x2="16" y2="96" stroke="#6b7280" stroke-width="6"/>
      <line x1="16" y1="18" x2="94" y2="96" stroke="#d1d5db" stroke-width="2.5"/>
      <line x1="94" y1="18" x2="16" y2="96" stroke="#d1d5db" stroke-width="2.5"/>
      <!-- chắn kiếm -->
      <line x1="74" y1="76" x2="86" y2="64" stroke="#9ca3af" stroke-width="5"/>
      <line x1="36" y1="76" x2="24" y2="64" stroke="#9ca3af" stroke-width="5"/>
      <!-- cán kiếm -->
      <line x1="86" y1="90" x2="98" y2="102" stroke="#4b5563" stroke-width="7"/>
      <line x1="24" y1="90" x2="12" y2="102" stroke="#4b5563" stroke-width="7"/>
    </g>
    <!-- đầu lâu -->
    <path d="M55 14 C34 14 26 29 26 43 C26 53 31 59 37 63 L37 72 Q37 76 41 76 L69 76 Q73 76 73 72 L73 63 C79 59 84 53 84 43 C84 29 76 14 55 14Z" fill="#e5e7eb" stroke="#111" stroke-width="2"/>
    <!-- hốc mắt -->
    <ellipse cx="44" cy="45" rx="8" ry="9" fill="#0a0a0a"/>
    <ellipse cx="66" cy="45" rx="8" ry="9" fill="#0a0a0a"/>
    <!-- mũi -->
    <path d="M55 52 L50 62 L60 62Z" fill="#0a0a0a"/>
    <!-- răng -->
    <g stroke="#111" stroke-width="1.5">
      <line x1="45" y1="68" x2="45" y2="76"/>
      <line x1="52" y1="68" x2="52" y2="76"/>
      <line x1="58" y1="68" x2="58" y2="76"/>
      <line x1="65" y1="68" x2="65" y2="76"/>
    </g>
  </svg>

  <header>
    <h1>GPO Boss Timers</h1>
    <div class="subtitle">Grand Piece Online</div>
    <div class="sync-info">🕐 Đồng bộ theo GMT+7 (Giờ Việt Nam)</div>
  </header>

  <div class="live-clock" id="liveClock">
    00:00:00
    <span id="liveDate">Thứ 2, 01/01/2026</span>
  </div>

  <div id="cardsContainer"></div>

  <footer>✦ GPO Boss Timers VN ✦ Chúc farm vui ✦</footer>
</div>

<script>
// =============================================
// CONFIG: Boss spawn schedules (giờ VN = GMT+7)
// =============================================
const BOSSES = [
  {
    id: 'brook',
    name: 'Brook',
    emoji: '💀',
    intervalHours: 1,
    firstSpawn: { h: 5, m: 0 }, // 01:00 GMT+3 = 05:00 VN
    color: '#94a3b8',
    description: 'Soul King',
    location: 'Thriller Bark',
  },
  {
    id: 'mihawk',
    name: 'Mihawk',
    emoji: '⚔️',
    intervalHours: 2,
    firstSpawn: { h: 5, m: 0 }, // 01:00 GMT+3 = 05:00 VN
    color: '#cbd5e1',
    description: 'Đại kiếm sĩ',
    location: 'Mihawk Island',
  },
  {
    id: 'roger',
    name: 'Roger',
    emoji: '☠️',
    intervalHours: 1.5,
    firstSpawn: { h: 4, m: 0 }, // 00:00 GMT+3 = 04:00 VN
    color: '#e2e8f0',
    description: 'Vua Hải Tặc',
    location: 'Laugh Tale',
  },
];

// Alert state
const alertState = {};
BOSSES.forEach(b => alertState[b.id] = false);

// Audio context for alert beep
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playBeep(frequency = 880, duration = 0.3) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = frequency;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}
function playAlert() {
  playBeep(880, 0.2);
  setTimeout(() => playBeep(1100, 0.2), 250);
  setTimeout(() => playBeep(880, 0.4), 500);
}

// Alerted set (so we don't re-alert every second)
const alerted = {};
BOSSES.forEach(b => alerted[b.id] = false);

// Giờ Việt Nam (GMT+7): dùng các hàm getUTC* trên đối tượng này,
// không phụ thuộc múi giờ của trình duyệt.
function getVNDate() {
  return new Date(Date.now() + 7 * 3600000);
}

// Các mốc spawn quanh hiện tại (từ hôm qua đến ngày mai), neo theo 00:00 VN
function getSpawnTimesToday(boss) {
  const vn = getVNDate();
  const dayStart = Date.UTC(vn.getUTCFullYear(), vn.getUTCMonth(), vn.getUTCDate());
  const anchor = dayStart + (boss.firstSpawn.h * 60 + boss.firstSpawn.m) * 60000;
  const intervalMs = boss.intervalHours * 3600000;

  let t = anchor + Math.floor((dayStart - intervalMs - anchor) / intervalMs) * intervalMs;
  const limit = dayStart + 48 * 3600000;
  const times = [];
  while (t <= limit) {
    times.push(new Date(t));
    t += intervalMs;
  }
  return times;
}

function getNextAndPrevSpawn(boss) {
  const now = getVNDate();
  const times = getSpawnTimesToday(boss);

  let next = null, prev = null;
  for (const t of times) {
    if (t > now) { next = t; break; }
    prev = t;
  }

  return { next, prev };
}

function formatCountdown(ms) {
  if (ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function formatTime(date) {
  if (!date) return '--:--';
  const h = String(date.getUTCHours()).padStart(2,'0');
  const m = String(date.getUTCMinutes()).padStart(2,'0');
  return `${h}:${m}`;
}

function msSince(date) {
  return getVNDate() - date;
}

function msUntil(date) {
  return date - getVNDate();
}

// Day names
const DAYS = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];

// Build cards once
function buildCards() {
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '';
  BOSSES.forEach(boss => {
    const card = document.createElement('div');
    card.className = 'boss-card';
    card.id = `card-${boss.id}`;
    card.innerHTML = `
      <div class="boss-header">
        <div>
          <div class="boss-name">${boss.emoji} ${boss.name}</div>
          <div class="boss-schedule" style="color:${boss.color}">📍 ${boss.location} &nbsp;·&nbsp; ${boss.description}</div>
        </div>
        <div class="boss-schedule" id="schedule-${boss.id}">Mỗi ${formatInterval(boss.intervalHours)}</div>
      </div>
      <div class="timers-row">
        <div class="timer-block">
          <div class="timer-label">⏳ Còn lại</div>
          <div class="timer-value" id="next-${boss.id}">--:--:--</div>
        </div>
      </div>
      <div class="next-spawn" id="nexttime-${boss.id}">Spawn tiếp theo: --:--</div>
      <div class="card-footer">
        <div class="spawn-times" id="spawntimes-${boss.id}"></div>
        <button class="alert-btn off" id="alertbtn-${boss.id}" onclick="toggleAlert('${boss.id}')">
          🔔 ALERT OFF
        </button>
      </div>
    `;
    container.appendChild(card);
    updateSpawnList(boss);
  });
}

function formatInterval(h) {
  if (h === Math.floor(h)) return `${h}h`;
  const whole = Math.floor(h);
  const mins = Math.round((h - whole) * 60);
  return `${whole}h${mins}p`;
}

function updateSpawnList(boss) {
  const times = getSpawnTimesToday(boss);
  const now = getVNDate();
  const upcoming = times.filter(t => t > now).slice(0, 5);
  const el = document.getElementById(`spawntimes-${boss.id}`);
  if (el) {
    el.textContent = 'Spawn hôm nay: ' + upcoming.map(t => formatTime(t)).join(' · ');
  }
}

function toggleAlert(bossId) {
  alertState[bossId] = !alertState[bossId];
  const btn = document.getElementById(`alertbtn-${bossId}`);
  if (alertState[bossId]) {
    btn.className = 'alert-btn on';
    btn.textContent = '🔔 ALERT ON';
    // Unlock audio
    try { getAudioCtx().resume(); } catch(e){}
    playBeep(660, 0.1);
  } else {
    btn.className = 'alert-btn off';
    btn.textContent = '🔔 ALERT OFF';
  }
}

// Update clock & timers
function tick() {
  const vn = getVNDate();

  // Clock
  const h = String(vn.getUTCHours()).padStart(2,'0');
  const m = String(vn.getUTCMinutes()).padStart(2,'0');
  const s = String(vn.getUTCSeconds()).padStart(2,'0');
  document.getElementById('liveClock').childNodes[0].textContent = `${h}:${m}:${s}`;

  const day = DAYS[vn.getUTCDay()];
  const date = `${String(vn.getUTCDate()).padStart(2,'0')}/${String(vn.getUTCMonth()+1).padStart(2,'0')}/${vn.getUTCFullYear()}`;
  document.getElementById('liveDate').textContent = `${day}, ${date}`;

  // Bosses
  BOSSES.forEach(boss => {
    const { next } = getNextAndPrevSpawn(boss);
    const nextEl  = document.getElementById(`next-${boss.id}`);
    const nexttimeEl = document.getElementById(`nexttime-${boss.id}`);

    if (next) {
      const msLeft = msUntil(next);
      const cd = formatCountdown(msLeft);

      // Color warning
      if (msLeft < 60000) {
        nextEl.className = 'timer-value danger';
      } else if (msLeft < 5 * 60000) {
        nextEl.className = 'timer-value warning';
      } else {
        nextEl.className = 'timer-value';
      }
      nextEl.textContent = cd;
      nexttimeEl.textContent = `Spawn tiếp theo: ${formatTime(next)}`;

      // Alert at 1 minute
      if (alertState[boss.id] && msLeft < 60000 && !alerted[boss.id]) {
        alerted[boss.id] = true;
        playAlert();
        // Show browser notification if granted
        if (Notification.permission === 'granted') {
          new Notification(`GPO: ${boss.name} sắp spawn!`, {
            body: `${boss.name} spawn tại ${boss.location} sau ít hơn 1 phút!`,
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">☠️</text></svg>',
            silent: true,
          });
        }
      }
      // Reset alerted after spawn
      if (msLeft > 90000) alerted[boss.id] = false;
    } else {
      nextEl.textContent = '--:--:--';
      nexttimeEl.textContent = 'Không tìm thấy spawn tiếp theo';
    }

    updateSpawnList(boss);
  });
}

// Request notification permission on load
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

buildCards();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
